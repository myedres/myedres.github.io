- number: "1"
  title: Fill out our online form
  text: We'll need some basic details from you, including your name, email and phone number. Then, we'll ask you to tell us about your gold items.
- number: "2"
  title: Get a cash offer
  text: Once you've submitted your form, we'll get back to you as soon as we can with a cash offer. This might be over email or by phone, depending on your preference.
- number: "3"
  title: Choose how to send your gold
  text: If you're happy with your offer, you can choose to send your gold with a prepaid, fully insured shipping label, or we can arrange a courier service to come and collect. If you'd rather hand over your gold in person, you can bring your items to our store.
- number: "4"
  title: Get cash for your gold
  text: Once we've received and tested your items, we'll give you the cash offer we quoted. If your gold isn't of the quality we expected, we may not be able to give you the full amount.