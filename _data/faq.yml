- question: What influences the price of gold?
  answer: >-
    Gold is traded on a global marketplace, so the price we offer for 
    your gold can fluctuate based on a wide variety of factors. We'll 
    always use the current market price to guide our offer when you're 
    looking to sell your gold, giving you a fair offer for your items.
  open: true
- question: How do I package and ship my items?
  answer: >-
    Prepaid and insured shipping labels are available. Include a 
    printed copy of your trade confirmation inside the package. 
    Missing documents may delay payment processing. Wrap each item 
    individually in bubble wrap or soft material, and use a sturdy 
    box with ample padding to prevent movement during transit.
- question: How long does payment take?
  answer: >-
    Payment is usually sent after your metals are received, inspected, and
    verified. Processing typically takes one business day depending on
    verification and the payment method. Exact timing may vary based on
    the transaction.
- question: What metals do you accept?
  answer: >-
    Top Dollar Gold typically deals with major precious metals such as
    gold, silver, platinum, and palladium. Accepted items usually include
    bullion, coins, bars, jewelry, and scrap or damaged items. Eligibility
    depends on purity and market demand.
- question: How will I be paid?
  answer: >-
    Payments are usually issued through common methods such as Interac 
    e-Transfer, bank deposit, checks or other approved options. 
    The available method is confirmed during the transaction, and payment 
    is sent after the metals pass inspection and verification.
